name: Bug Report
description: File a bug report for NetScope
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Provide a reproducible bug report with operating system, Python version, command executed, and error output.
  - type: input
    id: environment
    attributes:
      label: Operating System & Python Version
      placeholder: "e.g. Windows 11 / Ubuntu 22.04, Python 3.12"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: What CLI command or API call did you execute?
      placeholder: "netscope scan --subnet 192.168.1.0/24"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error Output or Stacktrace
      render: shell
